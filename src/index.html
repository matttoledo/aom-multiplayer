<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>AoMY — stream</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; gap: 12px; padding: 12px; }
  /* o jogo ja desenha o proprio cursor; o do navegador por cima deixa um rastro */
  canvas, video { background: #000; border: 1px solid #333; width: 1280px; height: 720px; cursor: none; }
  #stats { font: 12px/1.7 ui-monospace, monospace; color: #8ab; white-space: pre; }
  #hint { color: #777; font-size: 12px; max-width: 320px; }
  #volbox { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; }
  #vol { width: 160px; }
  /* tela cheia: o video ocupa a tela toda mantendo 16:9 (faixas pretas se a tela
     tiver outra proporcao); pos() desconta as faixas */
  video:fullscreen, canvas:fullscreen { width: 100vw; height: 100vh; border: 0; object-fit: contain; }
</style>
</head>
<body>
<div id="wrap">
  <div>
    <canvas id="view" width="1280" height="720"></canvas>
    <video id="play" muted playsinline style="display:none"></video>
  </div>
  <div>
    <div id="stats">conectando…</div>
    <button id="probe">medir latencia (probe)</button>
    <button id="sound">ativar som</button>
    <button id="full">tela cheia</button>
    <button id="invite" style="display:none">copiar convite</button>
    <div id="convite" style="display:none; font-size:12px; margin:6px 0">
      <span id="conviteMsg"></span>
      <input id="conviteUrl" readonly style="display:none; width:300px">
    </div>
    <label id="volbox">volume <input id="vol" type="range" min="0" max="100" step="1" value="100"> <span id="volpct">100%</span></label>
    <audio id="som" playsinline></audio>
    <div id="hint">Clique na tela para enviar input. Teclado funciona com o foco nesta página. O cursor do navegador esta escondido sobre a tela: o jogo desenha o dele, e a camera anda quando esse cursor chega nos extremos.</div>
  </div>
</div>
<script>
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const video = document.getElementById('play');
const stats = document.getElementById('stats');
const audio = document.getElementById('som');

let mode = null;             // 'webcodecs' ou 'mse', confirmado pelo servidor
let decoder = null;
let sb = null;               // SourceBuffer do MSE
let queue = [];
let asb = null;              // SourceBuffer de audio (AAC). Audio sempre vai por MSE:
                             // WebCodecs decodifica video, mas AudioDecoder exigiria
                             // extrair o AAC do fMP4; um SourceBuffer separado e mais
                             // simples e funciona nos dois caminhos.
let audioQueue = [];
let audioCodec = 'mp4a.40.2';
let audioFragments = 0;
let iceConfig = [];            // iceServers vindos do hello-ok (STUN sempre, TURN junto se configurado)
let clockOffset = null;      // relogio do servidor (epoch ms) -> performance.now()
let netDelay = null;         // captura -> navegador
let playerLag = null;        // atraso do player MSE
let serverStart = null;      // epoch ms do inicio do pipeline no servidor
let renderLatency = null;    // captura -> frame na tela (medido, nao estimado)
let fragmentsAppended = 0;
let framesOut = 0;
let fpsWindow = [];
let diag = { binarias: 0, texto: 0, decodeErr: '-', mseErr: '-', audioErr: '-' };
let rtcStats = {};

/* Estatisticas reais do recebedor WebRTC: o que o navegador realmente recebeu e
   quanto tempo o jitter buffer dele segurou cada frame. */
async function pollStats(myPc) {
  if (!pc || pc !== myPc) return;
  try {
    const s = await pc.getStats();
    s.forEach((r) => {
      if (r.type === 'inbound-rtp' && r.kind === 'audio') {
        rtcStats.audioPkts = r.packetsReceived;
        rtcStats.audioLost = r.packetsLost;
        rtcStats.audioLevel = r.audioLevel;
      }
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        rtcStats.recebidos = r.packetsReceived;
        rtcStats.perdidos = r.packetsLost;
        rtcStats.fpsRtc = r.framesPerSecond;
        rtcStats.decodificados = r.framesDecoded;
        rtcStats.jitter = (r.jitterBufferDelay && r.jitterBufferEmittedCount)
          ? (r.jitterBufferDelay / r.jitterBufferEmittedCount) * 1000 : null;
        rtcStats.decoder = r.decoderImplementation;
        rtcStats.limitacao = r.qualityLimitationReason;
        rtcStats.nack = r.nackCount;
        rtcStats.pli = r.pliCount;
        // inbound-rtp NAO tem codecName no Chrome: o codec vem do objeto apontado por
        // codecId. Sem isso o painel mostrava "-".
        rtcStats.codecName = r.codecName;
        if (r.codecId) {
          const c = stats.get(r.codecId);
          if (c && c.mimeType) rtcStats.codecName = c.mimeType;
        }
        rtcStats.keyframes = r.keyFramesDecoded;
        rtcStats.qp = r.qp;
        rtcStats.bytes = r.bytesReceived;
        const now = performance.now();
        if (rtcStats.prevBytes != null && now > rtcStats.prevTime) {
          // bytes/segundo * 8 = bps. Dividir por 1000 para kbps.
          rtcStats.kbps = (r.bytesReceived - rtcStats.prevBytes) /
                           ((now - rtcStats.prevTime) / 1000) * 8 / 1000;
        }
        rtcStats.prevBytes = r.bytesReceived;
        rtcStats.prevTime = now;
      }
    });
    updateStats();
  } catch (e) { /* ignore */ }
  setTimeout(() => pollStats(myPc), 2000);
}

/* ---------- probe de latencia real ----------
   O servidor desenha um quadrado magenta no display e informa o instante (epoch).
   A pagina procura esse pixel no frame ja na tela; quando ele aparece, a diferenca
   e a latencia captura->tela medida, sem depender de mediaTime nem de suposicoes.
*/
const MARK = { x: 1232, y: 696 };   // centro do marcador: janela 1200,680 64x32
const sampleCanvas = document.createElement('canvas');
sampleCanvas.width = 1280;
sampleCanvas.height = 720;
const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
let probe = null;          // { drawnServer: epoch s }
let probeLatency = null;

function checkMarker(context) {
  if (!probe || clockOffset == null) return;
  const p = context.getImageData(MARK.x, MARK.y, 1, 1).data;
  // o H.264 e perdas: o magenta chega como (249,0,254), nao (255,0,255)
  if (p[0] > 200 && p[1] < 60 && p[2] > 200) {
    probeLatency = performance.now() - (probe.drawnServer * 1000 + clockOffset);
    probe = null;
    updateStats();
  }
}

function totalLatency() {
  if (netDelay == null) return null;
  return netDelay + (playerLag || 0);
}

function updateStats() {
  stats.textContent =
    'modo:                 ' + (mode || '-') + '\n' +
    'binarias:             ' + diag.binarias + '\n' +
    'frames render:        ' + framesOut + '\n' +
    'fps:                  ' + (fpsWindow.length > 1 ? ((fpsWindow.length - 1) / ((fpsWindow[fpsWindow.length - 1] - fpsWindow[0]) / 1000)).toFixed(1) : '0.0') + '\n' +
    'fragmentos appendados:  ' + fragmentsAppended + '\n' +
    'delay de rede:        ' + (netDelay == null ? '-' : netDelay.toFixed(0) + ' ms') + '\n' +
    'atraso do player:     ' + (playerLag == null ? '-' : playerLag.toFixed(0) + ' ms') + '\n' +
    'LATENCIA REAL (captura->tela): ' + (renderLatency == null ? '-' : renderLatency.toFixed(0) + ' ms') + '\n' +
    'LATENCIA MEDIDA POR PROBE:      ' + (probeLatency == null ? '-' : probeLatency.toFixed(0) + ' ms') + '\n' +
    'erro decoder:         ' + diag.decodeErr + '\n' +
    'erro mse:             ' + diag.mseErr + '\n' +
    (mode === 'webrtc'
      ? 'audio (opus):         ' + (rtcStats.audioPkts == null ? '-' : rtcStats.audioPkts + ' pacotes, ' +
          rtcStats.audioLost + ' perdidos, nivel ' + (rtcStats.audioLevel || 0).toFixed(3)) +
        ' | ' + (audio.paused ? 'pausado (clique "ativar som")' : 'tocando') + '\n'
      : '') +
    'audio:                ' + audioFragments + ' fragmentos' +
      (audioFragments ? ' | ' + (audio.paused ? 'pausado (clique "ativar som")' : 'tocando') : '') +
      (diag.audioErr !== '-' ? ' | ' + diag.audioErr : '') + '\n' +
    // clockOffset mapeia epoch-ms -> performance.now(). Como performance.now() conta
    // desde o load da pagina, o numero e enorme e negativo por natureza: nao e erro,
    // e a origem do relogio. O que importa e que seja estavel.
    'offset de relogio:    ' + (clockOffset == null ? '-' : (clockOffset / 1e6).toFixed(3) + ' Ms (origem do relogio)') +
    (pc ? '\n\n--- WebRTC ---\n' +
      'codec negociado:      ' + (rtcStats.codecName ?? '-') + '\n' +
      'bitrate recebido:     ' + (rtcStats.kbps == null ? '-' : rtcStats.kbps.toFixed(0) + ' kbps') + '\n' +
      'keyframes decodificados: ' + (rtcStats.keyframes ?? '-') + '\n' +
      'QP medio:             ' + (rtcStats.qp ?? '-') + '\n' +
      'preferencia de codec: ' + (diag.codecPref ?? '-') + '\n' +
      'pacotes recebidos:    ' + (rtcStats.recebidos ?? '-') + '\n' +
      'pacotes perdidos:     ' + (rtcStats.perdidos ?? '-') + '\n' +
      'fps no decoder:       ' + (rtcStats.fpsRtc ?? '-') + '\n' +
      'frames decodificados: ' + (rtcStats.decodificados ?? '-') + '\n' +
      'jitter buffer:        ' + (rtcStats.jitter == null ? '-' : rtcStats.jitter.toFixed(0) + ' ms') + '\n' +
      'decoder:              ' + (rtcStats.decoder ?? '-') + '\n' +
      'limitacao:            ' + (rtcStats.limitacao ?? '-') + '\n' +
      'NACK / PLI:           ' + (rtcStats.nack ?? '-') + ' / ' + (rtcStats.pli ?? '-') + '\n' +
      'input por:            ' + (diag.input ?? 'websocket') + '\n' +
      'websocket:            ' + (diag.ws ?? '-')
      : '');
}

/* ---------- WebCodecs ---------- */
function makeDecoder() {
  const d = new VideoDecoder({
    output: (frame) => {
      framesOut++;
      ctx.drawImage(frame, 0, 0);
      frame.close();
      checkMarker(ctx);
      const now = performance.now();
      fpsWindow.push(now);
      while (fpsWindow.length > 0 && now - fpsWindow[0] > 5000) fpsWindow.shift();
      updateStats();
    },
    error: (e) => { diag.decodeErr = e.message; updateStats(); }
  });
  d.configure({ codec: 'avc1.42001f', optimizeForLatency: true });
  return d;
}

/* ---------- MSE ---------- */
function initMSE() {
  canvas.style.display = 'none';
  video.style.display = 'block';
  const ms = new MediaSource();
  video.src = URL.createObjectURL(ms);
  video.muted = true;
  ms.addEventListener('sourceopen', () => {
    try {
      sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42001f"');
    } catch (e) {
      diag.mseErr = 'addSourceBuffer: ' + e.message;
      updateStats();
      return;
    }
    sb.mode = 'segment';
    try { sb.lowLatency = true; } catch (e) { /* nem todo navegador aceita */ }
    sb.addEventListener('updateend', drain);
    sb.addEventListener('error', () => { diag.mseErr = 'sourcebuffer error'; updateStats(); });
    video.play().catch(() => {});
    video.requestVideoFrameCallback(onRendered);
    drain();
  });
}

function drain() {
  if (!sb || sb.updating || !queue.length) return;
  const item = queue.shift();
  if (item.kind === 1) fragmentsAppended++;
  sb.appendBuffer(item.payload);
}

/* ---------- audio (MSE, kinds 2 e 3) ---------- */
function initAudioMSE() {
  const ms = new MediaSource();
  audio.src = URL.createObjectURL(ms);
  ms.addEventListener('sourceopen', () => {
    try {
      asb = ms.addSourceBuffer('audio/mp4; codecs="' + audioCodec + '"');
    } catch (e) {
      diag.audioErr = 'addSourceBuffer: ' + e.message;
      updateStats();
      return;
    }
    asb.mode = 'segment';
    try { asb.lowLatency = true; } catch (e) { /* nem todo navegador aceita */ }
    asb.addEventListener('updateend', drainAudio);
    asb.addEventListener('error', () => { diag.audioErr = 'sourcebuffer error'; updateStats(); });
    drainAudio();
  });
}

function drainAudio() {
  if (!asb || asb.updating || !audioQueue.length) return;
  const item = audioQueue.shift();
  if (item.kind === 3) audioFragments++;
  asb.appendBuffer(item.payload);
}

// O navegador bloqueia autoplay com som: play() so funciona depois de um gesto do
// usuario (o botao "ativar som", ou o primeiro clique na tela).
function enableSound() {
  audio.play().then(() => { diag.audioErr = '-'; }).catch((e) => {
    diag.audioErr = 'play bloqueado: ' + e.message;
    updateStats();
  });
}
document.getElementById('sound').addEventListener('click', enableSound);

// Volume local do <audio>: nao mexe no som do jogo no asus nem no dos outros
// jogadores. Fica salvo neste navegador (localStorage pode faltar em aba anonima).
const vol = document.getElementById('vol');
const volPct = document.getElementById('volpct');
function setVolume(v) {
  audio.volume = v / 100;
  vol.value = v;
  volPct.textContent = v + '%';
}
let volSalvo = null;
try { volSalvo = localStorage.getItem('aom-volume'); } catch (e) { /* sem storage */ }
setVolume(volSalvo != null && !isNaN(+volSalvo) ? +volSalvo : 100);
vol.addEventListener('input', () => {
  setVolume(+vol.value);
  try { localStorage.setItem('aom-volume', vol.value); } catch (e) { /* sem storage */ }
});

// latencia real: momento em que o frame vai para a tela menos o momento em que foi capturado
function onRendered(now, meta) {
  if (serverStart != null && clockOffset != null && meta && meta.mediaTime != null) {
    // serverStart esta em segundos de epoch; clockOffset e mediaTime*1000 em ms
    renderLatency = now - (serverStart * 1000 + meta.mediaTime * 1000 + clockOffset);
    framesOut++;
    fpsWindow.push(now);
    while (fpsWindow.length > 0 && now - fpsWindow[0] > 5000) fpsWindow.shift();
    updateStats();
  }
  // o frame acabou de ir para a tela: e aqui que o probe deve ser lido
  try {
    sctx.drawImage(video, 0, 0);
    checkMarker(sctx);
  } catch (e) { /* video ainda sem dados */ }
  video.requestVideoFrameCallback(onRendered);
}

function keepLive() {
  if (!sb || !sb.buffered.length) return;
  const end = sb.buffered.end(sb.buffered.length - 1);
  const lag = (end - video.currentTime) * 1000;
  playerLag = lag;
  if (lag > 250) video.currentTime = end;   // mantem no live edge
  updateStats();
}
video.addEventListener('timeupdate', keepLive);

/* ---------- WebRTC ---------- */
let pc = null;
let inputDc = null;          // DataChannel do input: P2P, nao depende do tunel

async function initWebRTC() {
  canvas.style.display = 'none';
  video.style.display = 'block';
  pc = new RTCPeerConnection({ iceServers: iceConfig });
  const myPc = pc;
  // ICE morto (rede do jogador trocou, NAT expirou): refaz a sessao inteira.
  // "disconnected" pode voltar sozinho; so reconecta se durar mais de 5 s.
  let discTimer = null;
  pc.onconnectionstatechange = () => {
    if (pc !== myPc) return;
    const st = myPc.connectionState;
    clearTimeout(discTimer);
    if (st === 'failed') reconnect('webrtc failed');
    else if (st === 'disconnected') {
      discTimer = setTimeout(() => {
        if (pc === myPc && myPc.connectionState !== 'connected') reconnect('webrtc disconnected');
      }, 5000);
    }
  };
  const t = pc.addTransceiver('video', { direction: 'recvonly' });
  // audio Opus no mesmo transporte P2P do video (no modo webrtc nao ha MSE de audio)
  pc.addTransceiver('audio', { direction: 'recvonly' });

  // Sem isso o Chrome prefere VP8 e o servidor codifica em libvpx por software
  // (~1 Mbps) -> tela pixelizada. Forcar H264 faz o servidor usar NVENC.
  // Ojo: o Chrome pode devolver "video/H264" com H maiusculo -> comparar case-insensitive.
  try {
    // A API certa e RTCRtpReceiver.getCapabilities('video').codecs.
    // RTCRtpTransceiver.getReceiverCapabilities NAO existe no Chromium (medido:
    // "is not a function") -> o try caia, a preferencia nunca era aplicada, e o
    // Chrome negociava VP8 -> o servidor codificava em libvpx por software.
    const caps = (RTCRtpReceiver.getCapabilities('video') || {}).codecs
      || (typeof RTCRtpTransceiver.getReceiverCapabilities === 'function'
          ? RTCRtpTransceiver.getReceiverCapabilities('video') : []);
    const h264 = caps.filter((c) => c.mimeType.toLowerCase() === 'video/h264');
    if (h264.length) {
      // NAO filtrar só o H264: sem o rtx pareado (apt = payloadType do H264) o
      // navegador nao pede NACK e o servidor nao retransmite -> perda vira quadro
      // perdido ate o proximo IDR. Medido: com rtx na preferencia, o aiortc
      // retransmite 100% dos NACKs e nao ha falha de decode em 5%/10% de perda.
      const pts = new Set(h264.map((c) => c.payloadType));
      const rtx = caps.filter((c) =>
        c.mimeType.toLowerCase() === 'video/rtx' && c.parameters && pts.has(c.parameters.apt));
      t.setCodecPreferences(h264.concat(rtx));
      diag.codecPref = 'h264 forcado + rtx ' + rtx.length;
    } else {
      diag.codecPref = 'h264 indisponivel';
    }
  } catch (e) {
    diag.codecPref = 'setCodecPreferences falhou: ' + e.message;
  }

  // Input (e ping/probe) por DataChannel, P2P junto com o video. Com ele a partida
  // sobrevive a queda do WebSocket, que passa pelo tunel do Cloudflare.
  inputDc = pc.createDataChannel('input');   // ordenado e confiavel: mouseup nao se perde
  inputDc.onmessage = (e) => onMessage({ data: e.data });
  inputDc.onopen = () => { diag.input = 'datachannel (p2p)'; updateStats(); };
  inputDc.onclose = () => { if (pc === myPc) { diag.input = 'websocket'; updateStats(); } };

  pc.ontrack = (ev) => {
    tentativas = 0;
    // o <video> e mudo de proposito; o som vai no <audio>, que o botao "ativar som"
    // (ou o primeiro clique) libera do bloqueio de autoplay
    if (ev.track.kind === 'audio') {
      audio.srcObject = new MediaStream([ev.track]);
      enableSound();
      return;
    }
    video.srcObject = new MediaStream([ev.track]);
    video.play().catch(() => {});
    video.requestVideoFrameCallback(onRendered);
  };

  // aiortc do servidor nao suporta trickle ICE: os candidatos so entram no ICE se
  // estiverem dentro do SDP. Por isso a oferta vai depois que o gathering completa.
  let sentOffer = false;
  const sendOffer = () => {
    if (sentOffer || !pc.localDescription) return;
    sentOffer = true;
    diag.iceGathering = pc.iceGatheringState;
    ws.send(JSON.stringify({ t: 'offer', sdp: pc.localDescription.sdp }));
  };
  pc.onicegatheringstatechange = () => {
    diag.iceGathering = pc.iceGatheringState;
    if (pc.iceGatheringState === 'complete') sendOffer();
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);   // gathering comeca aqui
  setTimeout(sendOffer, 3000);           // fallback, nao fica travado
  rtcStats = {};
  pollStats(myPc);
}

/* ---------- protocolo ---------- */
let ultimoErro = null;
let fatal = false;           // erro que reconectar nao resolve: token, modo, outra aba
let tentativas = 0;
let reconnectTimer = null;
let pingTimer = null;
let ws = null;
const params = new URLSearchParams(location.search);
const forced = params.get('mode');

/* Reconexao automatica. A queda de 2026-10-14 (17:09:59, 38 min de partida) foi o
   WebSocket: o caminho navegador -> Cloudflare -> tunel -> asus caiu, o servidor
   derrubou a sessao e so o F5 trazia o jogo de volta. O jogo roda no asus e nao
   sabe da queda: basta abrir outra sessao. Espera 1, 2, 4... ate 10 s entre
   tentativas; o contador zera quando o video volta. */
function reconnect(motivo) {
  if (fatal || reconnectTimer) return;
  if (ws && ws.readyState <= 1) { ws.onclose = null; ws.onmessage = null; ws.close(); }
  if (pc) { pc.close(); pc = null; inputDc = null; }
  clearInterval(pingTimer);
  const espera = Math.min(10000, 1000 * 2 ** tentativas);
  tentativas++;
  stats.textContent = 'conexao caiu (' + motivo + '), reconectando em ' + (espera / 1000) + ' s…';
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, espera);
}

function connect() {
  // Cloudflare serve a pagina por HTTPS -> o WebSocket precisa ser wss. Em http://
  // (localhost ou LAN) ws:// continua correto.
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.binaryType = 'arraybuffer';
  diag.ws = 'conectando';
  ws.onopen = onOpen;
  ws.onclose = onClose;
  ws.onmessage = onMessage;
}

function onOpen() {
  diag.ws = 'aberto';
  stats.textContent = 'conectado, aguardando hello…';
  const hasWebCodecs = typeof VideoDecoder !== 'undefined';
  const declared = forced || (hasWebCodecs ? 'webcodecs' : 'mse');
  ws.send(JSON.stringify({ t: 'hello', decoder: declared, token: params.get('t') || '' }));
  ws.send(JSON.stringify({ t: 'ping', ts: performance.now() }));
  // Cloudflare fecha um WebSocket depois de ~100 s sem trafego. O video mantem o
  // canal ocupado, mas um ping a cada 30 s cobre os periodos sem video e mantem o
  // clockOffset atualizado (o relogio do navegador deriva de performance.now()).
  clearInterval(pingTimer);
  // o ping fica no WebSocket mesmo com o DataChannel aberto: e o trafego que impede o
  // Cloudflare de fechar o WebSocket ocioso
  pingTimer = setInterval(() => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: performance.now() }));
  }, 30000);
}

// O motivo do fechamento vem no `error` do servidor, mas o close vinha depois e
// sobrescrevia. Sem isto o jogador ve so "conexao fechada" e nao sabe que faltou o
// ?t=<token> na URL.
function onClose(e) {
  // 4000 = esta sessao foi aberta em outra aba/dispositivo: reconectar aqui
  // derrubaria a outra, e as duas ficariam se derrubando
  if (e.code === 4000) { fatal = true; ultimoErro = e.reason || 'sessao aberta em outro lugar'; }
  // o motivo vai na linha "websocket:" do painel: o texto solto seria sobrescrito
  // pelo proximo updateStats enquanto o pc ainda existe
  diag.ws = 'fechado (' + e.code + ')' + (ultimoErro ? ' — ' + ultimoErro : '');
  // so o modo webrtc sabe se refazer; MSE/WebCodecs continuam como antes
  if (fatal || mode !== 'webrtc') {
    stats.textContent = 'conexao fechada (' + e.code + ')' + (ultimoErro ? ' — ' + ultimoErro : '');
    return;
  }
  // video e input andam P2P: a queda do tunel nao interrompe a partida. Se o WebRTC
  // cair depois, o onconnectionstatechange reconecta (abrindo outro WebSocket).
  if (pc && pc.connectionState === 'connected' && inputDc && inputDc.readyState === 'open') {
    clearInterval(pingTimer);
    diag.ws = 'caiu (' + e.code + '), partida segue pelo canal P2P';
    updateStats();
    return;
  }
  reconnect('websocket ' + e.code);
}

function onMessage(e) {
  const d = e.data;
  if (typeof d === 'string') {
    diag.texto++;
    try {
      const m = JSON.parse(d);
      // qualquer mensagem pode trazer a origem de mediaTime (hello-ok, answer, start)
      if (m.serverStart) serverStart = m.serverStart;
      if (m.t === 'hello-ok') {
        mode = m.mode;
        if (m.audio) audioCodec = m.audio;
        if (m.ice) iceConfig = m.ice;
        if (m.serverStart) serverStart = m.serverStart;
        document.getElementById('invite').style.display = m.owner ? '' : 'none';
        if (mode === 'mse') initMSE();
        else if (mode === 'webrtc') initWebRTC();
        else decoder = makeDecoder();
        if (audioCodec && mode !== 'webrtc') initAudioMSE();
      } else if (m.t === 'answer') {
        if (m.serverStart) serverStart = m.serverStart;
        if (pc) pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      } else if (m.t === 'ice') {
        if (pc) pc.addIceCandidate(m.candidate).catch(() => {});
      } else if (m.t === 'pong') {
        const now = performance.now();
        const rtt = now - m.client_ts;
        clockOffset = (m.client_ts + rtt / 2) - m.server_ts * 1000;
      } else if (m.t === 'invite-ok') {
        showInvite(m);
      } else if (m.t === 'invite-err') {
        conviteBox.style.display = '';
        conviteMsg.textContent = 'convite: ' + m.msg;
        conviteUrl.style.display = 'none';
      } else if (m.t === 'probe-at') {
        probe = { drawnServer: m.drawn };
      } else if (m.t === 'error') {
        fatal = true;
        ultimoErro = m.msg;
        stats.textContent = 'erro: ' + m.msg;
        return;
      }
    } catch (_) {}
    updateStats();
    return;
  }

  const bytes = new Uint8Array(d);
  if (bytes.length < 9) return;
  diag.binarias++;

  const kind = bytes[0];
  const serverTs = new DataView(d, bytes.byteOffset + 1, 8).getFloat64(0, true);
  const payload = bytes.subarray(9);
  if (clockOffset != null) netDelay = performance.now() - (serverTs * 1000 + clockOffset);

  if (kind === 2 || kind === 3) {
    audioQueue.push({ kind, payload });
    drainAudio();
    return;
  }

  if (mode === 'mse') {
    queue.push({ kind, payload });
    drain();
    return;
  }

  // webcodecs: payload e uma access unit Annex-B; kind 1 = keyframe
  if (!decoder) decoder = makeDecoder();
  if (decoder.state !== 'configured') return;
  try {
    decoder.decode({
      type: kind === 1 ? 'key' : 'delta',
      timestamp: Math.round(serverTs * 1000),
      data: payload
    });
  } catch (err) {
    diag.decodeErr = err.message;
  }
  updateStats();
}

/* ---------- input ---------- */
function send(obj) {
  if (inputDc && inputDc.readyState === 'open') inputDc.send(JSON.stringify(obj));
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

document.getElementById('probe').addEventListener('click', () => {
  probeLatency = null;
  probe = null;
  send({ t: 'probe' });
});

// Coordenada na tela do jogo (1280x720). Fora da tela cheia o elemento tem
// exatamente esse tamanho; em tela cheia ele escala e pode ter faixas pretas. O
// clamp manda o ponteiro na faixa para a borda do jogo, onde a camera anda.
function pos(e) {
  const r = target().getBoundingClientRect();
  const W = 1280, H = 720;
  const k = Math.min(r.width / W, r.height / H);
  const ox = r.left + (r.width - W * k) / 2;
  const oy = r.top + (r.height - H * k) / 2;
  return {
    x: Math.max(0, Math.min(W - 1, Math.round((e.clientX - ox) / k))),
    y: Math.max(0, Math.min(H - 1, Math.round((e.clientY - oy) / k))),
  };
}

// Convite (so o dono ve o botao): o servidor devolve um token que vence em 48 h e a
// pagina monta o link. Se o navegador nao deixar copiar, o link aparece num campo.
const conviteBox = document.getElementById('convite');
const conviteMsg = document.getElementById('conviteMsg');
const conviteUrl = document.getElementById('conviteUrl');
document.getElementById('invite').addEventListener('click', () => send({ t: 'invite' }));
function showInvite(m) {
  const url = location.origin + location.pathname + '?mode=webrtc&t=' + encodeURIComponent(m.token);
  const vence = new Date(m.expires * 1000).toLocaleString('pt-BR',
    { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const texto = 'jogador ' + m.player + ', vale ate ' + vence;
  conviteBox.style.display = '';
  conviteUrl.value = url;
  navigator.clipboard.writeText(url).then(() => {
    conviteMsg.textContent = 'link copiado (' + texto + ')';
    conviteUrl.style.display = 'none';
  }).catch(() => {
    conviteMsg.textContent = 'copie o link (' + texto + '):';
    conviteUrl.style.display = '';
    conviteUrl.select();
  });
}

// Tela cheia no proprio video. O Keyboard Lock (Chrome) segura as teclas que o
// navegador tomaria para si, como Esc: assim o Esc vai para o jogo, e para sair
// da tela cheia e preciso segurar Esc.
document.getElementById('full').addEventListener('click', async () => {
  try {
    await target().requestFullscreen();
    if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
  } catch (e) { diag.fullErr = e.message; }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) {
    navigator.keyboard.unlock();
  }
});

function target() { return mode === 'webcodecs' ? canvas : video; }

// sem isso o Chrome abre o menu de contexto no botao direito e o clique nunca chega ao jogo
document.addEventListener('contextmenu', (e) => {
  if (target().contains(e.target)) e.preventDefault();
});

document.addEventListener('mousedown', (e) => {
  if (!target().contains(e.target)) return;
  const p = pos(e);
  send({ t: 'mouse', button: e.button + 1, x: p.x, y: p.y, down: true });
});
document.addEventListener('mouseup', (e) => {
  if (!target().contains(e.target)) return;
  const p = pos(e);
  send({ t: 'mouse', button: e.button + 1, x: p.x, y: p.y, down: false });
});
document.addEventListener('mousemove', (e) => {
  if (!target().contains(e.target)) return;
  const p = pos(e);
  send({ t: 'move', x: p.x, y: p.y });
});

// teclas com o foco num controle da pagina (a barra de volume) nao vao para o jogo:
// sem isso as setas mexeriam no volume e na camera ao mesmo tempo
const noControle = (e) => e.target instanceof HTMLInputElement;
document.addEventListener('keydown', (e) => { if (!noControle(e)) send({ t: 'key', key: e.key, down: true }); });
document.addEventListener('keyup', (e) => { if (!noControle(e)) send({ t: 'key', key: e.key, down: false }); });

connect();
</script>
