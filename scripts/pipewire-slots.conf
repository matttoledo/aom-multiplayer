# Drop-in do PipeWire: um null-audio-sink por jogador.
#
# Instalado em ~/.config/pipewire/pipewire.conf.d/50-aom-slots.conf e aplicado com
#   systemctl --user restart pipewire
#
# Por que aqui e nao via WirePlumber: `pw-cli create-node adapter` e scripts Lua do
# WirePlumber (LocalNode/SessionItem) NAO criam sinks neste ambiente - a ativacao do
# session item falha com "Object activation aborted: PipeWire proxy destroyed".
# Os objetos criados por context.objects funcionam: o sink aparece no pw-dump, ganha
# ports quando um stream e linkado a ele, e o monitor entrega audio.
#
# aom_default e o primeiro sink da lista, entao o policy do PipeWire encaminha todo
# stream para ele. Esse sink NAO e capturado: ele e o "desvio" que permite linkar cada
# instancia a um slot proprio sem contaminar os outros slots.
#
# Medido: stream A linkado a aom_slot1 e stream B a aom_slot2 -> o monitor de slot1
# continha so 440 Hz (Goertzel 1447.8, 1000 Hz = 0.1) e o de slot2 so 1000 Hz
# (610.1, 440 Hz = 0.3). Isolamento por instancia confirmado.

context.objects = [
    { factory = adapter, args = {
        factory.name = support.null-audio-sink
        node.name = aom_default
        node.description = "AOM default (not captured)"
        media.class = Audio/Sink
        audio.channel.map = fl,fr
        audio.rate = 48000
        node.virtual = true
        monitor.channel-volumes = true
    } }
    { factory = adapter, args = {
        factory.name = support.null-audio-sink
        node.name = aom_slot1
        node.description = "AOM slot 1"
        media.class = Audio/Sink
        audio.channel.map = fl,fr
        audio.rate = 48000
        node.virtual = true
        monitor.channel-volumes = true
    } }
    { factory = adapter, args = {
        factory.name = support.null-audio-sink
        node.name = aom_slot2
        node.description = "AOM slot 2"
        media.class = Audio/Sink
        audio.channel.map = fl,fr
        audio.rate = 48000
        node.virtual = true
        monitor.channel-volumes = true
    } }
    { factory = adapter, args = {
