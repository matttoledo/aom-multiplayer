Section "ServerLayout"
    Identifier "layout"
    Screen 0 "nvgpu"
EndSection

Section "Modes"
    Identifier "Modes"
    Modeline "1280x720" 80.0 1280 1376 1424 1600 720 736 737 760
EndSection

Section "Device"
    Identifier "nvgpu"
    Driver "nvidia"
    Option "UseDisplayDevice" "None"
    Option "ProbeAllGpus" "1"
    Option "ModeValidation" "NoMaxSizePerScreen, NoWholeModes, NoVertRefresh"
EndSection

Section "Screen"
    Identifier "nvgpu"
    Device "nvgpu"
    DefaultDepth 24
    Subsection "Display"
        Depth 24
        Virtual 1280 720
        Modes "1280x720"
    EndSubsection
EndSection
